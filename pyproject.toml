[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierofolio"
version = "0.1.0"
description = "ETF universe config, price fetching, and portfolio analysis (HRP / MVO / robust MVO)."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "cvxpy",
    "PyYAML",
    "matplotlib",
    "requests",
    "yfinance",
    "ftgo",
]

[project.scripts]
hierofolio = "hierofolio.cli:main"
hfolio     = "hierofolio.cli:main"
h8o     = "hierofolio.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
